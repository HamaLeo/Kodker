<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فێرکاری — کۆدکەر</title>
  <meta name="description" content="فێربوونی پڕۆگرامینگ بە کوردی، هەنگاو بە هەنگاو. ١١ وانە لە گۆڕاو هەتا پۆل، بە ئەرک و پشکنینی خۆکار.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flag-bar" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="top">
    <a class="brand" href="index.html" style="color:inherit;text-decoration:none">
      <span class="logo" aria-hidden="true">☀</span><h1>کۆدکەر</h1>
    </a>
    <nav>
      <a href="index.html">Playground</a>
      <a href="https://github.com/HamaLeo/kodker" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <div class="tut">
    <aside class="side">
      <h2>🎓 فێرکاری</h2>
      <div class="progress" title="پێشکەوتن"><i id="bar"></i></div>
      <ol id="list"></ol>
    </aside>

    <article class="lesson">
      <div class="intro">
        <h2 id="title"></h2>
        <div id="body"></div>
        <p class="task" id="task"></p>
      </div>

      <div class="tut-play">
        <section class="pane">
          <div class="bar">
            <button id="run" class="primary" title="Ctrl + Enter">▶ جێبەجێبکە و بپشکنە</button>
            <button id="hint">💡 ئاماژە</button>
            <button id="reset">↺ دەستپێکەوە</button>
          </div>
          <div id="editor"></div>
        </section>
        <section class="pane">
          <div class="bar"><b>دەرچوون</b><span id="status" class="status"></span></div>
          <pre id="output" class="out" dir="rtl"></pre>
        </section>
      </div>

      <div id="msg" class="msg" aria-live="polite">کۆدەکەت بنووسە و «جێبەجێبکە» دابگرە.</div>
      <div id="hintbox" class="hint" hidden></div>

      <div class="nav-row">
        <button id="prev">→ وانەی پێشوو</button>
        <button id="solution">👀 وەڵام نیشان بدە</button>
        <span class="spacer"></span>
        <button id="next" class="sun" disabled>وانەی داهاتوو ←</button>
      </div>
    </article>
  </div>

  <footer>
    <a href="index.html">گەڕانەوە بۆ Playground</a> · <a href="https://github.com/HamaLeo/kodker" target="_blank" rel="noopener">سەرچاوە لە GitHub</a>
  </footer>

  <script src="kodker.js"></script>
  <script src="lessons.js"></script>
  <script src="runner.js"></script>
  <script src="editor.js"></script>
  <script src="tutorial.js"></script>
</body>
</html>
