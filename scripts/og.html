<!doctype html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:"Vazirmatn";font-weight:400;src:url("../docs/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:"Vazirmatn";font-weight:400;src:url("../docs/fonts/vazirmatn-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Vazirmatn";font-weight:700;src:url("../docs/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:"Vazirmatn";font-weight:700;src:url("../docs/fonts/vazirmatn-latin-700-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Vazirmatn";font-weight:800;src:url("../docs/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:"Vazirmatn";font-weight:800;src:url("../docs/fonts/vazirmatn-latin-800-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box}
html{overflow:hidden}
body{margin:0;width:1200px;height:630px;overflow:hidden;color:#eaeefb;font-family:"Vazirmatn","Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;
background:radial-gradient(700px 420px at 90% 0%,rgba(254,189,17,.22),transparent 60%),radial-gradient(700px 420px at 0% 100%,rgba(39,142,67,.25),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(237,32,36,.12),transparent 60%),#0b0f1f;position:relative}
.flag{position:absolute;top:0;left:0;right:0;height:10px;display:flex}.flag i{flex:1}.flag i:nth-child(1){background:#ed2024}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#278e43}
.bg{position:absolute;inset:0;overflow:hidden}
.sun{position:absolute;width:760px;left:-190px;top:-70px;opacity:.10}
.row{position:absolute;inset:0;padding:0 90px;display:flex;align-items:center;justify-content:space-between;gap:50px}
.logo{width:290px;height:290px;filter:drop-shadow(0 10px 40px rgba(254,189,17,.45))}
h1{margin:0;font-size:120px;line-height:1.1;font-weight:800;letter-spacing:-1px}
.hl{background:linear-gradient(90deg,#febd11,#ff8420 55%,#ed2024);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:14px 0 0;font-size:40px;color:#b3bde0}
.code{margin-top:34px;display:inline-block;background:#0a0e1d;border:1px solid #333d68;border-radius:16px;padding:14px 26px;font:34px/1.5 ui-monospace,Menlo,Consolas,monospace;direction:rtl}
.k{color:#ff8a5c}.f{color:#5ec8ff}.s{color:#9be37e}.n{color:#febd11}
.url{position:absolute;bottom:34px;left:0;right:0;text-align:center;font:26px ui-monospace,Menlo,monospace;color:#8d99bf;direction:ltr}
</style></head><body>
<div class="flag"><i></i><i></i><i></i></div>
<div class="bg"><img class="sun" src="../docs/logo.svg" alt=""></div>
<div class="row">
  <div>
    <h1><span class="hl">کۆدکەر</span></h1>
    <p>پڕۆگرامینگ بە زمانی کوردی</p>
    <div class="code"><span class="k">بۆ</span> i <span class="k">لە</span> <span class="n">١</span> <span class="k">تا</span> <span class="n">٣</span> { <span class="f">چاپ</span>(<span class="s">"سڵاو"</span>) }</div>
  </div>
  <img class="logo" src="../docs/logo.svg" alt="">
</div>
<div class="url">hamaleo.github.io/kodker</div>
</body></html>
